name: Build Advancements LeviLamroid

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Advancements
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Fetch LeviLamroid headers
        shell: bash
        run: |
          git clone --depth 1 https://github.com/spygamingog/LeviLamroid.git "$GITHUB_WORKSPACE/../LeviLamroid-reference"

      - name: Configure ARM64 build
        shell: bash
        run: |
          cmake -S . -B build-levilamroid -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DLEVILAMROID_DIR="$GITHUB_WORKSPACE/../LeviLamroid-reference"

      - name: Build and package
        run: cmake --build build-levilamroid --parallel 2

      - name: Upload LeviPack and native library
        uses: actions/upload-artifact@v4
        with:
          name: Advancements-LeviLamroid-${{ github.sha }}
          path: |
            build-levilamroid/AdvancementsLeviLamroid.levipack
            build-levilamroid/libAdvancementsLeviLamroid.so
          if-no-files-found: error
